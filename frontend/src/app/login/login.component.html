


    <div *ngIf="showBase" class="base">
        <div class="logito"></div>
        <div>
            <button class="btn-login" id="btnIniciarSesion" (click)="toggleDisplay()">Inicia Sesión</button>
        </div>
    </div>

    <!-- Rectángulo centrado oculto inicialmente -->
    <div *ngIf="!showBase" class="centered-rectangle" id="rectangle" >
        <h2 class="text-center">Bienvenido</h2>
        <form>
            <div class="demo-access">
                <strong>Acceso de demostración</strong>
                <span>Estudiante: 2202045 / demo1234</span>
                <span>Administrador: admin / admin1234</span>
            </div>
            <div class="mb-3">
                <!-- <label for="username" class="form-label">Usuario</label> -->
                <input type="text" class="form-control" id="username" placeholder="Usuario" [(ngModel)]="code" name="code">
            </div>
            <div class="mb-3">
                <!-- <label for="password" class="form-label">Contraseña</label> -->
                <input type="password" class="form-control" id="password" placeholder="Contraseña" [(ngModel)]="contrasena" name="contrasena">
                <a href="#" class="forgot-pass">¿Olvidó su contraseña?</a>
            </div>

            <p *ngIf="mensajeError" class="login-error" role="alert">{{ mensajeError }}</p>
            <div>
                <button type="button" class="btn-Ingresar" (click)="consulta()" [disabled]="cargando">
                    {{ cargando ? 'Ingresando...' : 'Ingresar' }}
                </button>
            </div>
        </form>
    </div>
    <!-- <script src="login.component.ts"></script> -->
